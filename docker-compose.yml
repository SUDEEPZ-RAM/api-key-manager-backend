services:
  mysql:
    image: mysql:8.4
    container_name: vault-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: api_key_manager
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - vault_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  vault_mysql_data:
