spring.application.name=api-key-manager
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/api_key_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.encryption.secret=${ENCRYPTION_SECRET:}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
